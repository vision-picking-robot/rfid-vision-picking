name: Build Galaxy Remote APK

on:
  push:
    branches: [main, 'review/**']
    paths:
      - 'galaxy_app/**'
      - '.github/workflows/build-galaxy-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Build Debug APK
        working-directory: galaxy_app
        run: gradle assembleDebug --no-daemon
      - name: Upload Galaxy APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-e0509-remote-apk
          path: galaxy_app/app/build/outputs/apk/debug/*.apk
