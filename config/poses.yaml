# 자세·바닥 높이 설정 (단위: mm, deg / 기준 좌표계: base)
#
# - posx: [x, y, z, rx, ry, rz]  (두산 ZYZ 오일러)
# - posj: [j1, j2, j3, j4, j5, j6]
# - taught: 직접 교시로 기록했으면 true. 실물 모드(real)에서는 taught: true 인 자세만 사용한다.
# - 교시 도우미(마일스톤 4)가 이 파일의 값을 채운다. 손으로 숫자를 지어내 넣지 말 것.

floor:
  # 바닥 높이: 그리퍼를 닫고 TCP를 테이블에 살짝 닿게 해 최소 4곳 측정 → 가장 높은 값
  floor_z: 0.0             # 측정 완료 (실측 -1.05mm, 여유치 0.0mm 반영)
  floor_samples: [-1.05]   # 측정한 z 값들
  # 소프트웨어 하한선 = floor_z + safety_margin + nfc_protrusion
  safety_margin: 10.0
  # NFC 리더기 하단이 TCP(손끝)보다 아래로 나온 양. 위에 있으면 0
  nfc_protrusion: 0.0      # 리더기가 TCP보다 아래로 나오지 않았으면 0.0

# 가상 모드(mode:=virtual) 테스트 전용 값. 실물에는 절대 쓰이지 않는다.
virtual:
  floor_z: 100.0
  nfc_protrusion: 0.0

motion:
  approach_offset_z: 150.0   # 집기 자세 위 접근 및 인출 높이 (+15cm = 150mm)
  # 실물 첫 실행은 30 이하 (README 안전 규칙). 2026-11-12: 빈 그리퍼 이동 2.25배(lvel 30 → 67.5) 허용을 위해 70으로 올림.
  max_vel: 70.0
  max_acc: 70.0

poses:
  home:                     # YOLO 촬영 시 카메라 시야 밖이어야 함
    posx: [373.0, 0.0, 285.0, 12.44, 180.0, 12.44]
    posj: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]
    taught: true
  # 2026-11-12 재교시: 손으로 리더기가 상자 태그를 읽는 위치에 둠
  # (플랜지 -303.02, 314.82, 162.86 / 기울기 1.9° → 수직으로 저장). 이전 값: (-323, 280), Z 50
  label_scan_approach:      # 리더기 접근 위치 (Z 285mm), posj = 같은 해 공간 ikin
    posx: [-303.0, 314.8, 285.0, 126.99, 180.0, -52.46]
    posj: [133.91, 9.88, 79.27, 0.0, 90.85, -45.54]
    taught: true
  label_scan:               # 리더기가 태그를 읽는 위치 (손끝 Z 42.9mm)
    posx: [-303.0, 314.8, 42.9, 126.99, 180.0, -52.46]
    posj: [133.91, 21.02, 104.61, 0.0, 54.37, -45.54]
    taught: true
  # 2026-11-12 재교시 (via_point, box_high, box_slots[1]): 손으로 옮긴 위치를 수직 자세로 저장,
  # posj = 같은 해 공간 ikin. 원본(기울기 포함)은 state/taught_carry_2026-11-12.jsonl.
  # box_high가 taught이면 via_point/box_high/박스 슬롯 z를 교시값 그대로 쓴다(--lift-extra, --place-extra 미적용).
  via_point:                # 물체를 집은 뒤 들르는 중간 지점 (손끝 Z 250mm). 이전 값: (0, 373), Z 285
    posx: [-136.8, 334.4, 250.1, 155.37, 180.0, 1.78]
    posj: [112.25, -1.55, 96.90, 0.0, 84.65, -41.34]
    taught: true
  box_high:                 # 상자 위, 상자 높이를 감안해 높인 지점 (손끝 Z 424mm)
    posx: [-372.4, 287.3, 423.9, -9.36, 180.0, 162.96]
    posj: [142.35, 21.31, 42.54, 0.0, 116.15, -45.33]
    taught: true

# 박스 안 내려놓기 위치 (슬롯 번호 = 키)
box_slots:
  1:                        # 물건을 놓는 지점 (손끝 Z 235mm = 실제 놓는 높이). 이전 값: (-373, 0), Z 85 (+100 위에서 놓음)
    posx: [-368.5, 5.0, 234.9, 42.75, 180.0, -144.55]
    posj: [179.22, -0.17, 97.89, 0.0, 82.28, -8.08]
    taught: true
  2:
    posx: null
    posj: null
    taught: false
  3:
    posx: null
    posj: null
    taught: false
  4:
    posx: null
    posj: null
    taught: false
